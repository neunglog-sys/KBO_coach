name: Deploy to NCP

# dev 브랜치에 머지되면 배포 파일을 준비한다.
# NCP 서버는 외부에 SSH를 열지 않고 이 결과를 주기적으로 확인해 적용한다.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-ncp-dev
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend sources
        run: |
          python -m compileall -q services/api integrations scripts
          bash -n infra/ncp/kbo-auto-deploy.sh
          bash -n infra/ncp/install-auto-deploy.sh
          bash -n infra/ncp/install-scheduled-jobs.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend for NCP
        working-directory: frontend
        env:
          VITE_API_BASE: https://baseball-coach.duckdns.org
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          test -n "$VITE_API_BASE"
          test -n "$VITE_GOOGLE_CLIENT_ID"
          case "$VITE_GOOGLE_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *) echo "VITE_GOOGLE_CLIENT_ID 형식이 올바르지 않습니다." >&2; exit 1 ;;
          esac
          npm ci
          npm run typecheck
          npm run build
          printf '%s\n' "$GITHUB_SHA" > dist/.deploy-sha

      - name: Package deployment files
        run: |
          tar -C frontend/dist -czf frontend-dist.tar.gz .
          printf '%s\n' "$GITHUB_SHA" > backend-sha.txt

      - name: Publish rolling deployment bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ncp-dev >/dev/null 2>&1; then
            gh release create ncp-dev \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "NCP rolling deployment" \
              --notes "자동배포용 파일입니다. 직접 설치할 필요가 없습니다."
          fi
          gh release upload ncp-dev \
            frontend-dist.tar.gz \
            backend-sha.txt \
            --clobber
